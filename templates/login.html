{% extends 'base.html' %}
{% block title %}Login — {{ clinic.name }}{% endblock %}
{% block content %}
<section class="section auth-section">
  <div class="container auth-container">
    <div class="auth-card reveal">
      <div class="auth-icon">👤</div>
      <h1>Welcome Back</h1>
      <p class="auth-sub">Sign in to view and manage your bookings.</p>
      <form method="POST" action="{{ url_for('user_login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autofocus placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="auth-note">Don't have an account? <a href="{{ url_for('user_signup') }}">Sign up free →</a></p>
    </div>
  </div>
</section>
{% endblock %}
